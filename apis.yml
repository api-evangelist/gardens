aid: gardens
name: Gardens
description: >-
  Gardens (Gardens Interactive) is a distributed, remote-first video game studio
  founded in 2021 by veterans of Journey, What Remains of Edith Finch, Sky:
  Children of the Light, Blaseball, Dustforce, Guild Wars 2, and Firewatch. The
  studio builds lush, living worlds that bring players together to cultivate
  lasting friendships, and is developing an upcoming shared fantasy adventure — an
  ever-evolving online multiplayer sandbox set in a shapeshifting, unpredictable
  wilderness filled with mystery and magic, designed around meaningful moments
  shared between strangers. Co-founded by Chris Bell, Lexie Dostal, and Stephen
  Bell and based primarily out of Portland and Los Angeles, Gardens raised a
  $31.3M Series A co-led by Lightspeed Venture Partners. As a game studio, Gardens
  publishes no public developer API, SDK, or developer portal; this profile
  captures its identity within the API Evangelist network.
